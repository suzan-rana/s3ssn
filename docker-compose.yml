services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: s3ssn
      POSTGRES_PASSWORD: s3ssn
      POSTGRES_DB: s3ssn
    ports:
      - '5432:5432'
    volumes:
      - s3ssn_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6380:6379'

volumes:
  s3ssn_pg:
